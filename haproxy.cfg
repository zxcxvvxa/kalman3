global
    log stdout format raw local0
    maxconn 10000

defaults
    log global
    mode http
    option httplog
    option dontlognull
    option accept-invalid-http-request
    timeout connect 10s
    timeout client 3600s
    timeout server 3600s
    timeout tunnel 3600s
    timeout http-request 10s
    timeout http-keep-alive 300s

frontend http_in
    bind :8080
    mode http

    acl is_health path /health
    http-request return status 200 content-type "text/plain" string "OK" if is_health

    use_backend trojan_grpc if { path_beg /cxlvintr-grpc }
    use_backend vmess_grpc  if { path_beg /cxlvinvm-grpc }
    use_backend vless_grpc  if { path_beg /cxlvinvl-grpc }
    use_backend ss_grpc     if { path_beg /cxlvinss-grpc }

    use_backend trojan_xh if { path_beg /CxlvinTRXH }
    use_backend vless_xh  if { path_beg /CxlvinVlXH }
    use_backend ss_xh     if { path_beg /CxlvinSSXH }
    use_backend vmess_xh  if { path_beg /CxlvinVMXH }

    use_backend trojan_ws if { path_beg /CxlvinTRWS }
    use_backend vless_ws  if { path_beg /CxlvinVlWS }
    use_backend ss_ws     if { path_beg /CxlvinSSWS }
    use_backend vmess_ws  if { path_beg /CxlvinVMWS }

    # SSH-over-WebSocket -> ssh_ws.py bridge -> local sshd
    use_backend ssh_ws if { path_beg /CxlvinSSHWS }

    default_backend web_root

backend trojan_grpc
    mode http
    server s1 127.0.0.1:12001 proto h2

backend vmess_grpc
    mode http
    server s1 127.0.0.1:12002 proto h2

backend vless_grpc
    mode http
    server s1 127.0.0.1:12003 proto h2

backend ss_grpc
    mode http
    server s1 127.0.0.1:12004 proto h2

backend trojan_xh
    mode http
    server s1 127.0.0.1:10010

backend vless_xh
    mode http
    server s1 127.0.0.1:10009

backend ss_xh
    mode http
    server s1 127.0.0.1:10012

backend vmess_xh
    mode http
    server s1 127.0.0.1:10011

backend trojan_ws
    mode http
    server s1 127.0.0.1:10001

backend vless_ws
    mode http
    server s1 127.0.0.1:10002

backend ss_ws
    mode http
    server s1 127.0.0.1:10003

backend vmess_ws
    mode http
    server s1 127.0.0.1:10004

# ssh_ws.py listens here and bridges the WS connection to local sshd:22
backend ssh_ws
    mode http
    server s1 127.0.0.1:10005

backend web_root
    mode http
    server s1 127.0.0.1:80
