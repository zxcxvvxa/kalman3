worker_processes auto;
worker_cpu_affinity auto;
worker_rlimit_nofile 1048576;

events {
    worker_connections 16384;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 120;
    keepalive_requests 100000;
    reset_timedout_connection on;

    client_max_body_size 0;
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 3600s;

    server_tokens off;

    proxy_connect_timeout 10s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_socket_keepalive on;
    proxy_buffering off;
    proxy_request_buffering off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream trojan_ws {
        server 127.0.0.1:10001;
        keepalive 512;
    }

    upstream vless_ws {
        server 127.0.0.1:10002;
        keepalive 512;
    }

    upstream shadowsocks_ws {
        server 127.0.0.1:10003;
        keepalive 512;
    }

    upstream vmess_ws {
        server 127.0.0.1:10004;
        keepalive 512;
    }

    # ssh_ws.py: WS <-> TCP bridge in front of local sshd (127.0.0.1:22)
    upstream ssh_ws {
        server 127.0.0.1:10005;
        keepalive 512;
    }

    upstream trojan_xh {
        server 127.0.0.1:10010;
        keepalive 512;
    }

    upstream vless_xh {
        server 127.0.0.1:10009;
        keepalive 512;
    }

    upstream shadowsocks_xh {
        server 127.0.0.1:10012;
        keepalive 512;
    }

    upstream vmess_xh {
        server 127.0.0.1:10011;
        keepalive 512;
    }

    upstream trojan_grpc {
        server 127.0.0.1:12001;
        keepalive 512;
    }

    upstream vmess_grpc {
        server 127.0.0.1:12002;
        keepalive 512;
    }

    upstream vless_grpc {
        server 127.0.0.1:12003;
        keepalive 512;
    }

    upstream shadowsocks_grpc {
        server 127.0.0.1:12004;
        keepalive 512;
    }

    server {
        listen 80 default_server;
        server_name _;

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "OK\n";
        }

        location / {
            root /var/lib/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
            access_log off;
        }

        location ^~ /CxlvinTRWS {
            proxy_pass http://trojan_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location ^~ /CxlvinVlWS {
            proxy_pass http://vless_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location ^~ /CxlvinSSWS {
            proxy_pass http://shadowsocks_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location ^~ /CxlvinVMWS {
            proxy_pass http://vmess_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # SSH over WebSocket -> ssh_ws.py -> local sshd
        location ^~ /CxlvinSSHWS {
            proxy_pass http://ssh_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location ^~ /CxlvinTRXH {
            proxy_pass http://trojan_xh;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location ^~ /CxlvinVlXH {
            proxy_pass http://vless_xh;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location ^~ /CxlvinSSXH {
            proxy_pass http://shadowsocks_xh;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location ^~ /CxlvinVMXH {
            proxy_pass http://vmess_xh;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location ^~ /cxlvintr-grpc {
            grpc_pass grpc://trojan_grpc;
            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;
            grpc_buffer_size 512k;
        }

        location ^~ /cxlvinvm-grpc {
            grpc_pass grpc://vmess_grpc;
            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;
            grpc_buffer_size 512k;
        }

        location ^~ /cxlvinvl-grpc {
            grpc_pass grpc://vless_grpc;
            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;
            grpc_buffer_size 512k;
        }

        location ^~ /cxlvinss-grpc {
            grpc_pass grpc://shadowsocks_grpc;
            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;
            grpc_buffer_size 512k;
        }
    }
}
