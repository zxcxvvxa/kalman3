[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

; ---- real SSH daemon, bound to 127.0.0.1:22 only (see sshd_config) ----
[program:sshd]
command=/usr/sbin/sshd -D -e
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ---- WebSocket <-> TCP bridge in front of sshd ----
[program:ssh_ws]
command=python3 /usr/local/bin/ssh_ws.py
autorestart=true
priority=15
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ---- BadVPN UDPGW: UDP forwarding for SSH clients, localhost-only ----
[program:badvpn]
command=/usr/local/bin/badvpn-udpgw --listen-addr 127.0.0.1:7300 --max-clients 1000 --max-connections-for-client 40 --loglevel warning
autorestart=true
priority=25
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ---- xray-core: VLESS/VMess/Trojan/Shadowsocks over WS/gRPC/XHTTP ----
[program:xray]
command=/usr/local/bin/xray run -config /etc/xray.json
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ---- nginx: terminates WS upgrades / static page / health check ----
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
priority=30
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ---- haproxy: single public entrypoint on :8080, path-routes everything ----
[program:haproxy]
command=/usr/sbin/haproxy -db -f /etc/haproxy/haproxy.cfg
autorestart=true
priority=40
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
